services:
  app:
    build: .
    working_dir: /app
    tty: true
    stdin_open: true
    shm_size: 2gb
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./data:/app/data
    environment:
      - SETTINGS_PATH=config/settings.yaml
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: real_estate_ml
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d real_estate_ml"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/app:ro    # 👈 make your repo visible to the db container (read-only)
volumes:
  pgdata:
